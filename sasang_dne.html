<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사상체질 가이드 - 계양다나음한방병원</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f0f4f3;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.top-bar{width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dl-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:#2a9d8f;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;transition:background .2s}
.dl-btn:hover{background:#1f8072}
.hospital{color:#2a9d8f;font-size:17px;font-weight:700;letter-spacing:-0.3px}
.step-info{font-size:12px;color:#999}
.progress-wrap{width:100%;max-width:680px;margin-bottom:18px}
.progress-bar{height:5px;background:#dde;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2a9d8f,#57cc99);border-radius:3px;transition:width .35s ease}
.card{background:#fff;border-radius:18px;padding:32px 28px;width:100%;max-width:680px;box-shadow:0 2px 16px rgba(0,0,0,.07)}
.q-badge{display:inline-block;background:#e8f7f5;color:#2a9d8f;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:16px}
.q-title{font-size:21px;font-weight:700;color:#111;margin-bottom:6px;line-height:1.35}
.q-sub{font-size:14px;color:#777;margin-bottom:24px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:15px 18px;border:2px solid #e8eaea;border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-size:15px;color:#222;transition:all .18s;font-family:inherit;width:100%}
.opt:hover{border-color:#2a9d8f;background:#f0faf9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(42,157,143,.13)}
.opt:active{transform:translateY(0)}
.opt-num{width:30px;height:30px;border-radius:50%;background:#f0faf9;border:2px solid #2a9d8f;color:#2a9d8f;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-btn{margin-top:18px;background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;padding:6px;font-family:inherit}
.back-btn:hover{color:#555}
/* Result */
.res-wrap{text-align:center}
.res-emoji{font-size:56px;margin-bottom:8px}
.res-badge{display:inline-block;font-size:38px;font-weight:900;padding:12px 36px;border-radius:14px;margin-bottom:16px;letter-spacing:5px}
.res-badge.te{background:#d5e8d4;color:#2d6a4f}
.res-badge.sy{background:#ffd6d6;color:#b03030}
.res-badge.se{background:#dae8fc;color:#1a5296}
.res-badge.ty{background:#1a237e;color:#fff}
.res-badge.sy2{background:#ffd6d6;color:#b03030}
.res-title{font-size:22px;font-weight:700;color:#111;margin-bottom:6px}
.res-sub{font-size:14px;color:#777;margin-bottom:22px}
.res-desc{margin-bottom:20px}
.res-sections{display:flex;flex-direction:column;gap:12px;text-align:left}
.res-sec{background:#fafafa;border-radius:12px;padding:14px 16px}
.sec-hd{font-size:14px;font-weight:700;color:#2a9d8f;margin-bottom:8px}
.sec-body{font-size:13.5px;color:#444;line-height:1.7}
.food-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.food-col b{display:block;font-size:12px;font-weight:700;margin-bottom:6px;padding:3px 8px;border-radius:6px;text-align:center}
.food-col.good b{background:#d4edda;color:#155724}
.food-col.bad b{background:#f8d7da;color:#721c24}
.food-tags{display:flex;flex-wrap:wrap;gap:5px}
.food-tag{font-size:12px;padding:3px 8px;border-radius:20px;font-weight:500}
.food-col.good .food-tag{background:#e8f5e9;color:#2e7d32}
.food-col.bad .food-tag{background:#fce4ec;color:#880e4f}
.diet-box{margin-top:10px;background:#e8f7f5;border-radius:8px;padding:10px 12px;font-size:13px;color:#1a5c54;line-height:1.65}
.diet-box strong{display:block;margin-bottom:3px;font-weight:700}
.exer-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.exer-tag{background:#f0faf9;border:1.5px solid #2a9d8f;color:#2a9d8f;font-size:12px;padding:4px 11px;border-radius:20px;font-weight:600}
.dl-link{display:inline-flex;align-items:center;gap:6px;padding:13px 28px;background:#fff;color:#2a9d8f;border:2px solid #2a9d8f;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s}
.dl-link:hover{background:#e8f7f5}
.restart{padding:13px 40px;background:#2a9d8f;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.restart:hover{background:#1f8072}
.note{display:inline-block;background:#fff8e1;color:#7a5800;font-size:12px;padding:3px 10px;border-radius:4px;margin-bottom:14px}

/* ── 다이어트 전략 섹션 ── */
.diet-strat-sec{background:#f0fdf9;border-radius:12px;padding:16px;border:1.5px solid #b2dfdb;text-align:left}
.diet-headline{font-size:13.5px;font-weight:700;color:#1a5c54;margin:8px 0 14px;padding:10px 12px;background:#e0f2f1;border-radius:8px;text-align:center;line-height:1.5}
.strat-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #e0f2f1}
.strat-item:last-child{border-bottom:none;padding-bottom:0}
.strat-icon{font-size:20px;flex-shrink:0;width:26px;text-align:center;padding-top:1px}
.strat-text{flex:1}
.strat-label{font-size:11.5px;font-weight:700;color:#2a9d8f;margin-bottom:3px;letter-spacing:.3px}
.strat-body{font-size:13px;color:#444;line-height:1.55}

/* ── 공유 버튼 ── */
.share-btn{width:100%;padding:15px;background:linear-gradient(135deg,#2a9d8f,#40b59f);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-bottom:10px;letter-spacing:.3px}
.share-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,157,143,.3)}
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}

/* ── 공유 오버레이 ── */
.share-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.share-overlay.active{display:flex}
.share-modal{background:#fff;border-radius:22px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.share-modal-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f0f0}
.share-modal-title{font-size:15px;font-weight:700;color:#111}
.close-x{background:none;border:none;font-size:24px;cursor:pointer;color:#bbb;line-height:1;padding:0 2px;transition:color .15s}
.close-x:hover{color:#555}
.share-card-wrap{padding:14px;background:#f5f6f7}
/* 실제 캡처될 카드 */
.share-card{border-radius:18px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.card-inner{padding:26px 22px 20px}
.card-hosp-row{font-size:10px;font-weight:700;letter-spacing:1.5px;opacity:.75;margin-bottom:18px;display:flex;align-items:center;gap:5px}
.card-emoji-big{font-size:48px;margin-bottom:6px;display:block;line-height:1}
.card-name-ko{font-size:44px;font-weight:900;letter-spacing:5px;line-height:1;margin-bottom:4px}
.card-name-hanja{font-size:14px;font-weight:400;opacity:.7;margin-bottom:2px}
.card-sub-text{font-size:12px;opacity:.75;margin-bottom:18px}
.card-rule{height:1px;background:rgba(255,255,255,.25);margin-bottom:16px}
.card-blk{margin-bottom:14px}
.card-blk-label{font-size:9.5px;font-weight:700;letter-spacing:2px;opacity:.6;margin-bottom:5px;text-transform:uppercase}
.card-blk-value{font-size:13px;font-weight:600;line-height:1.5;opacity:.95}
.card-food-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.card-ftag{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.2);font-weight:600;border:1px solid rgba(255,255,255,.25)}
.card-footer{padding:10px 18px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:space-between;font-size:10.5px;opacity:.9;font-weight:500}
/* share actions */
.share-acts{display:flex;gap:8px;padding:12px 14px}
.sact-btn{flex:1;padding:12px 8px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;letter-spacing:.2px}
.sact-dl{background:#2a9d8f;color:#fff}
.sact-dl:hover{background:#1f8072}
.sact-ss{background:#f0faf9;color:#2a9d8f;border:1.5px solid #2a9d8f}
.share-tip{font-size:11px;color:#aaa;text-align:center;padding:0 14px 14px;line-height:1.5}

@media(max-width:480px){.card{padding:24px 18px}.q-title{font-size:18px}.res-badge{font-size:30px;padding:10px 24px}.share-modal{max-width:100%}}

/* ── 온보딩 슬라이드 ── */
.ob-wrap{width:100%;max-width:680px}
.ob-card{background:#fff;border-radius:18px;padding:36px 28px 28px;box-shadow:0 2px 16px rgba(0,0,0,.07);min-height:420px;display:flex;flex-direction:column;justify-content:space-between}

/* 상단 도트 인디케이터 */
.ob-dots{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:#dde;transition:all .25s}
.ob-dot.active{width:24px;border-radius:4px;background:#2a9d8f}

/* 슬라이드 콘텐츠 */
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center}

/* 슬라이드 1 */
.ob-eyebrow{font-size:11px;font-weight:700;color:#2a9d8f;letter-spacing:2.5px;margin-bottom:16px;text-transform:uppercase;text-align:center}
.ob-title{font-size:32px;font-weight:900;color:#111;line-height:1.2;letter-spacing:-1.5px;text-align:center;margin-bottom:14px}
.ob-title em{color:#2a9d8f;font-style:normal}
.ob-sub{font-size:14px;color:#777;line-height:1.75;text-align:center}
.ob-icon-big{font-size:64px;text-align:center;margin-bottom:18px;display:block;line-height:1}

/* 슬라이드 2 - 체질 카드 */
.ob-types-label{font-size:13px;font-weight:700;color:#333;margin-bottom:14px;text-align:center}
.ob-types-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ob-tc{border-radius:14px;padding:14px 13px 12px;border:2px solid transparent}
.ob-tc.te{background:#d5e8d4;border-color:#b2d5b0}
.ob-tc.sy{background:#ffd6d6;border-color:#f5b5b5}
.ob-tc.se{background:#dae8fc;border-color:#b5cff5}
.ob-tc.ty{background:#ece5f7;border-color:#cbb8ef}
.ob-tc-emoji{font-size:20px;display:block;margin-bottom:5px}
.ob-tc-name{font-size:15px;font-weight:900;color:#111;letter-spacing:.5px;margin-bottom:1px}
.ob-tc-hanja{font-size:10px;color:#777;margin-bottom:5px}
.ob-tc-pct{display:inline-block;background:rgba(255,255,255,.7);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:#555;margin-bottom:5px}
.ob-tc-desc{font-size:11px;color:#555;line-height:1.5}

/* 슬라이드 3 - 검사 안내 */
.ob-info-list{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.ob-info-item{display:flex;align-items:center;gap:16px;background:#f8fffe;border-radius:12px;padding:14px 16px;border:1.5px solid #e0f0ee}
.ob-info-icon{font-size:26px;flex-shrink:0}
.ob-info-text{}
.ob-info-title{font-size:14px;font-weight:700;color:#111;margin-bottom:2px}
.ob-info-desc{font-size:12.5px;color:#888;line-height:1.5}

/* 하단 버튼 영역 */
.ob-footer{margin-top:24px}
.ob-next-btn{width:100%;padding:16px;background:linear-gradient(135deg,#2a9d8f,#40b59f);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.4px;transition:all .2s}
.ob-next-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 20px rgba(42,157,143,.25)}
.ob-skip{display:block;text-align:center;margin-top:12px;font-size:12px;color:#bbb;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
.ob-skip:hover{color:#888}
.ob-disclaimer{text-align:center;font-size:11px;color:#ccc;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<!-- ── 온보딩 ── -->
<div id="obScreen" class="ob-wrap">
  <div class="ob-card">
    <div class="ob-dots" id="obDots">
      <div class="ob-dot active"></div>
      <div class="ob-dot"></div>
    </div>
    <div class="ob-body" id="obBody"></div>
    <div class="ob-footer">
      <button class="ob-next-btn" id="obNextBtn" onclick="obNext()">다음</button>
    </div>
  </div>
</div>

<!-- ── 퀴즈 (온보딩 끝나면 표시) ── -->
<div id="quizHeader" style="display:none;width:100%;max-width:680px">
  <div class="top-bar">
    <div class="hospital">🌿 사상체질 가이드 -계양다나음한방병원-</div>
    <div class="step-info" id="stepInfo">0번째 질문</div>
    <button class="dl-btn" onclick="downloadSelf()">⬇ 다운로드</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="pFill" style="width:0%"></div></div>
  </div>
</div>
<div class="card" id="card" style="display:none"></div>

<!-- 공유 오버레이 -->
<div class="share-overlay" id="shareOverlay" onclick="overlayClick(event)">
  <div class="share-modal" id="shareModal">
    <div class="share-modal-hd">
      <div class="share-modal-title">📤 결과 공유하기</div>
      <button class="close-x" onclick="closeShare()">×</button>
    </div>
    <div class="share-card-wrap">
      <div class="share-card" id="shareCard"><!-- 동적 생성 --></div>
    </div>
    <div class="share-acts">
      <button class="sact-btn sact-dl" id="sharePrimaryBtn" onclick="shareCard(this)">📤 공유하기</button>
      <button class="sact-btn sact-ss" onclick="downloadCard(this)">⬇ 저장</button>
      <button class="sact-btn sact-ss" onclick="closeShare()">닫기</button>
    </div>
    <div class="share-tip" id="shareTip">카드 이미지를 생성해 카카오톡·인스타그램 등으로 바로 공유할 수 있습니다 🙏</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ── 질문 트리 ────────────────────────────────────────────────
const Q = {
  Q1:{num:1,title:'골격',text:'다음 중 본인의 골격에 해당하는 것을 고르세요.',
    opts:['골격이 굵고 살이 찐 편이다','골격이 작고 균형이 잡혀있다','골격이 보통이며 다부진 체격이다'],
    next:a=>a===0?'Q3':'Q2'},
  Q2:{num:2,title:'땀',text:'평소 땀에 관한 설명 중 해당하는 것을 고르세요.',
    opts:['평소 땀이 많고 땀을 흘리면 오히려 상쾌하다','평소 땀이 많지 않고 조금만 땀을 내면 피곤하다','평소 땀은 보통이고 땀을 흘려도 피곤하지 않다'],
    next:a=>a===1?'Q4B':'Q6'},
  Q3:{num:3,title:'소변',text:'몸이 안 좋으면 소변부터 안 좋아지시나요?',
    opts:['예','아니오'],
    next:a=>a===0?'Q5':'Q4A'},
  Q4A:{num:4,title:'체형',text:'다음 중 당신의 체형은 어디에 해당합니까?',
    opts:['목덜미가 두텁고 허리가 없다','가슴 어깨가 발달하고 엉덩이가 볼품 없다','허리 아랫배가 발달하고 목덜미가 빈약하다','엉덩이 허벅지는 크고 가슴 어깨가 좁거나 작다'],
    next:a=>(a===1||a===2)?'태음인':'Q7'},
  Q4B:{num:4,title:'체형',text:'다음 중 당신의 체형은 어디에 해당합니까?',
    opts:['목덜미가 두텁고 허리가 없다','가슴 어깨가 발달하고 엉덩이가 볼품 없다','허리 아랫배가 발달하고 목덜미가 빈약하다','엉덩이 허벅지는 크고 가슴 어깨가 좁거나 작다'],
    next:a=>(a===0||a===3)?'소음인':'Q9'},
  Q5:{num:5,title:'걸음걸이',text:'당신의 걸음걸이는 다음 중 어디에 해당합니까?',
    opts:['걸음이 느리고 무게있다','걸음이 자연스럽고 얌전하다','걸음걸이가 빠르고 몸을 흔들며 걷는다','걸음걸이가 꼿꼿하다'],
    next:a=>a===0?'태음인':'Q10A'},
  Q6:{num:6,title:'성격',text:'성격은 다음 중 어디에 해당합니까?',
    opts:['거침 없고 과감하고 단호하다','활동적이며 용감하다','의젓하며 격식을 차린다','온순하고 꾸밈이 없다'],
    next:a=>(a===0||a===1)?'Q11A':'Q8'},
  Q7:{num:7,title:'일처리 습관',text:'당신의 일처리 습관은 어떤 쪽에 해당합니까?',
    opts:['무슨 일이든 밀고나간다','일을 벌여 놓기만 하고 마무리는 잘 못하는 편이다','움직이기 보다는 조용히 혼자서 일을 추진한다','한 곳에 있으려고 하고 나다니려 하지 않는다'],
    next:a=>a===2?'Q14A':'Q12A'},
  Q8:{num:8,title:'대인관계',text:'처음에 남 앞에 잘 나서지 못하는 편입니까?',
    opts:['예','아니오'],
    next:a=>a===0?'Q12B':'Q13'},
  Q9:{num:9,title:'관심도',text:'나의 일이 아닌 것에는 무관심한 편입니까?',
    opts:['예','아니오'],
    next:a=>a===0?'Q10B':'소양인'},
  Q10A:{num:10,title:'체형',text:'당신의 체형은 어떻습니까?',
    opts:['뚱뚱한 편','보통','마른 편 (살이 쪘다면 부분 비만)'],
    next:a=>a===0?'태음인':a===1?'소양인(태음인)':'소음인'},
  Q10B:{num:10,title:'체형',text:'당신의 체형은 어떻습니까?',
    opts:['뚱뚱한 편','보통','마른 편 (살이 쪘다면 부분 비만)'],

function renderQ(key){

  const card=document.getElementById('card');
  const nums=['①','②','③','④'];
  const back=hist.length>0?`<button class="back-btn" onclick="goBack()">← 이전 질문</button>`:'';
  const note=q.isRecheck?`<div class="note">📋 처음 문항을 다시 확인합니다</div>`:'';
  card.innerHTML=`
    <div class="q-badge">질문 ${q.num}</div>
    ${note}
    <div class="q-title">${q.title}</div>
    <div class="q-sub">${q.text}</div>
    <div class="opts">
      ${q.opts.map((o,i)=>`
        <button class="opt" onclick="pick('${key}',${i})">
          <span class="opt-num">${nums[i]}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>
    ${back}`;
  updateProg();
}

async function shareCard(btn){
  const card=document.getElementById('shareCard');
  const orig=btn.textContent;
  btn.textContent='⏳ 생성 중...';
  btn.disabled=true;
  try{
    const canvas=await html2canvas(card,{scale:2.5,useCORS:true,backgroundColor:null,logging:false});
    await new Promise((resolve,reject)=>{
      canvas.toBlob(async blob=>{
        try{
          const file=new File([blob],`사상체질_${currentResultKey||'결과'}.png`,{type:'image/png'});
          if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
            await navigator.share({
              title:`나의 체질은 ${currentResultKey}`,
              text:`사상체질 가이드에서 내 체질을 확인했어요!\n계양다나음한방병원`,
              files:[file]
            });
          }else if(navigator.share){
            await navigator.share({
              title:`나의 체질은 ${currentResultKey}`,
              text:`사상체질 가이드에서 내 체질을 확인했어요!\n계양다나음한방병원`,
              url:'https://www.danamedi.com/'
            });
          }else{
            document.getElementById('shareTip').textContent='이 브라우저는 공유를 지원하지 않습니다. 아래 저장 버튼으로 이미지를 저장 후 직접 공유해 주세요.';
          }
          resolve();
        }catch(e){
          if(e.name!=='AbortError') reject(e);
          else resolve();
        }
      },'image/png');
    });
  }catch(e){
    alert('공유 중 오류가 발생했습니다.\n이미지 저장 후 직접 공유해 주세요.');
  }
  btn.textContent=orig;
  btn.disabled=false;
}

async function downloadCard(btn){
  const card=document.getElementById('shareCard');

  }

}

// ── 답변 처리 ────────────────────────────────────────────────
function pick(key,a){
  stored[key]=a;
  if(key==='Q15'){multi.q15=a;multi.phase='Q16';renderQ('Q16');return;}
  if(key==='Q16'){
    multi.q16=a;
    const q15=multi.q15,q16=a;
    if(q15===0&&q16===1){hist.push(cur);cur='소양인';renderResult('소양인');return;}
    if(q15===1&&q16===0){hist.push(cur);cur='태음인';renderResult('태음인');return;}
    multi.phase='Q14B';renderQ('Q14B');return;
  }
  if(key==='Q14B'){
    const res=a===0?'소음인':'태음인';
    hist.push(cur);cur=res;renderResult(res);return;
  }
  const q=Q[key];
  const next=q.next(a);
  hist.push(cur);cur=next;step++;render(next);
}

function goBack(){
  if(hist.length===0)return;
  if(multi){
    if(multi.phase==='Q16'){multi.phase='Q15';multi.q15=null;renderQ('Q15');return;}
    if(multi.phase==='Q14B'){multi.phase='Q16';multi.q16=null;renderQ('Q16');return;}
  }
  multi=null;cur=hist.pop();step=Math.max(0,step-1);render(cur);
}

function restart(){
  cur='Q1';hist=[];stored={};multi=null;step=0;currentResultKey='';render('Q1');
}

function downloadSelf(){
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='사상체질_가이드_계양다나음.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateProg(){
  const pct=Math.min(step/9*100,90);
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('stepInfo').textContent=`${step}번째 질문`;
}

  if (obStep < OB_SLIDES.length - 1) { obStep++; obRender(obStep); }
